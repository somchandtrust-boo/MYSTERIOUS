<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Mysterious — Secret Knowledge Room</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#000;
    color:#fff;
}

/* =========================
   INTRO
========================= */

#intro{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 45%,#1d2027 0%,#08090c 35%,#000 75%);
}

/* stars */

.stars{
    position:absolute;
    inset:0;
    opacity:.35;
    background-image:
        radial-gradient(circle,white 1px,transparent 1px),
        radial-gradient(circle,rgba(255,255,255,.7) 1px,transparent 1px);
    background-size:95px 95px,145px 145px;
}

/* =========================
   FOG
========================= */

.fog{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
    filter:blur(45px);
    background:
        radial-gradient(
            ellipse,
            rgba(220,225,230,.25),
            rgba(120,125,135,.08),
            transparent 70%
        );
}

.fog1{
    width:900px;
    height:430px;
    left:-300px;
    bottom:-100px;
    animation:fog1 10s infinite alternate ease-in-out;
}

.fog2{
    width:850px;
    height:400px;
    right:-280px;
    top:-80px;
    animation:fog2 12s infinite alternate ease-in-out;
}

.fog3{
    width:650px;
    height:300px;
    left:30%;
    top:40%;
    opacity:.25;
    animation:fog3 9s infinite alternate ease-in-out;
}

@keyframes fog1{
    from{transform:translateX(0) scale(1);}
    to{transform:translateX(300px) scale(1.3);}
}

@keyframes fog2{
    from{transform:translateX(0) scale(1);}
    to{transform:translateX(-250px) scale(1.25);}
}

@keyframes fog3{
    from{transform:translateX(-150px);}
    to{transform:translateX(180px);}
}

/* =========================
   MYSTERIOUS BUTTON
========================= */

.secretButton{
    position:relative;
    z-index:10;

    width:210px;
    height:210px;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.35);

    background:
        radial-gradient(
            circle at 32% 25%,
            #777,
            #282a2e 35%,
            #050608 75%
        );

    color:#fff;

    cursor:pointer;

    font-size:25px;
    font-weight:bold;
    letter-spacing:5px;

    box-shadow:
        0 0 30px rgba(255,255,255,.12),
        inset 0 0 45px rgba(255,255,255,.08);

    transition:.5s;
}

.secretButton:hover{
    transform:scale(1.08);

    box-shadow:
        0 0 70px rgba(255,255,255,.22),
        inset 0 0 50px rgba(255,255,255,.12);
}

.secretButton:active{
    transform:scale(.94);
}

.secretButton::before{
    content:"";
    position:absolute;
    inset:-18px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.15);
    animation:pulse 2.5s infinite;
}

.secretButton::after{
    content:"";
    position:absolute;
    inset:-40px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.06);
}

.buttonSmall{
    display:block;
    margin-top:10px;
    font-size:9px;
    letter-spacing:3px;
    opacity:.5;
}

@keyframes pulse{
    0%{
        transform:scale(.9);
        opacity:.8;
    }
    100%{
        transform:scale(1.3);
        opacity:0;
    }
}

/* =========================
   DOOR
========================= */

#doorScene{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(
            ellipse at center,
            #373940 0%,
            #141519 38%,
            #020304 78%
        );
    z-index:50;
    overflow:hidden;
}

.doorFog{
    position:absolute;
    width:1100px;
    height:600px;
    border-radius:50%;
    background:
        radial-gradient(
            ellipse,
            rgba(230,235,240,.18),
            transparent 70%
        );
    filter:blur(55px);
    animation:doorFog 7s infinite alternate;
}

@keyframes doorFog{
    from{transform:translateX(-180px) scale(1);}
    to{transform:translateX(180px) scale(1.3);}
}

/* light rays */

.lightRay{
    position:absolute;
    width:4px;
    height:80vh;
    background:rgba(255,255,255,.06);
    filter:blur(15px);
    transform:rotate(18deg);
    opacity:0;
}

.ray1{
    left:35%;
}

.ray2{
    left:55%;
    transform:rotate(-18deg);
}

#doorScene.open .lightRay{
    animation:rayOpen 2.5s forwards;
}

@keyframes rayOpen{
    0%{
        opacity:0;
        transform:scaleY(.2) rotate(18deg);
    }
    100%{
        opacity:.8;
        transform:scaleY(1) rotate(18deg);
    }
}

/* frame */

.doorFrame{
    position:relative;

    width:min(420px,78vw);
    height:min(600px,84vh);

    border:9px solid #292b30;

    background:#000;

    box-shadow:
        0 0 40px rgba(255,255,255,.08),
        0 0 100px rgba(0,0,0,.9);

    overflow:hidden;
}

/* inside light */

.doorLight{
    position:absolute;
    inset:0;

    background:
        radial-gradient(
            ellipse at center,
            rgba(255,255,255,.95),
            rgba(150,155,165,.4),
            transparent 70%
        );

    opacity:0;

    transition:2.5s;
}

#doorScene.open .doorLight{
    opacity:1;
}

/* door */

.door{
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            90deg,
            #070809,
            #292a2f 45%,
            #090a0c
        );

    border:3px solid #5c5d61;

    transform-origin:left center;

    transition:
        transform 3.2s cubic-bezier(.77,0,.18,1);

    z-index:5;

    box-shadow:
        inset 0 0 50px rgba(0,0,0,.8);
}

.door::before{
    content:"";

    position:absolute;
    inset:24px;

    border:1px solid rgba(255,255,255,.14);

    box-shadow:
        inset 0 0 20px rgba(255,255,255,.03);
}

.door::after{
    content:"MYSTERIOUS";

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    font-size:25px;
    letter-spacing:7px;

    color:rgba(255,255,255,.42);

    white-space:nowrap;
}

.doorHandle{
    position:absolute;

    right:30px;
    top:50%;

    width:17px;
    height:17px;

    border-radius:50%;

    background:#aaa;

    box-shadow:
        0 0 15px rgba(255,255,255,.6);

    animation:handleGlow 1.8s infinite alternate;
}

@keyframes handleGlow{
    from{
        box-shadow:0 0 7px rgba(255,255,255,.3);
    }
    to{
        box-shadow:0 0 25px rgba(255,255,255,.8);
    }
}

#doorScene.open .door{
    transform:
        perspective(1400px)
        rotateY(-108deg);
}

/* =========================
   WELCOME
========================= */

#welcome{
    position:fixed;
    inset:0;

    display:none;

    justify-content:center;
    align-items:center;

    text-align:center;

    padding:30px;

    background:
        radial-gradient(
            circle at center,
            #202229,
            #020304 70%
        );

    z-index:70;
}

.welcomeBox{
    width:min(850px,95vw);
}

.access{
    font-size:11px;
    letter-spacing:6px;
    color:#aaa;
    margin-bottom:25px;
}

.welcomeTitle{
    font-size:clamp(38px,8vw,80px);
    letter-spacing:9px;
    margin-bottom:28px;

    text-shadow:
        0 0 30px rgba(255,255,255,.15);
}

.welcomeText{
    min-height:170px;

    font-size:
        clamp(17px,2.6vw,25px);

    line-height:1.9;

    color:#ddd;
}

.cursor{
    display:inline-block;
    width:2px;
    height:20px;
    background:white;
    animation:blink .8s infinite;
}

@keyframes blink{
    50%{opacity:0;}
}

.enterButton{
    margin-top:30px;

    padding:16px 34px;

    border:1px solid rgba(255,255,255,.3);

    border-radius:50px;

    background:
        rgba(255,255,255,.05);

    color:white;

    cursor:pointer;

    letter-spacing:2px;

    transition:.3s;
}

.enterButton:hover{
    background:white;
    color:#000;
    transform:scale(1.04);
}

/* =========================
   KNOWLEDGE ROOM
========================= */

#room{
    position:fixed;
    inset:0;

    display:none;

    overflow-y:auto;

    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(120,125,140,.18),
            transparent 30%
        ),
        #030406;

    z-index:100;
}

.header{
    text-align:center;
    padding:28px 20px 10px;
}

.logo{
    font-size:30px;
    letter-spacing:9px;
}

.subtitle{
    margin-top:8px;
    font-size:10px;
    letter-spacing:4px;
    color:#888;
}

/* =========================
   SEARCH
========================= */

.searchArea{
    min-height:70vh;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    padding:30px 20px;
}

.searchTitle{
    text-align:center;

    font-size:
        clamp(32px,6vw,70px);

    letter-spacing:5px;

    margin-bottom:14px;
}

.searchDescription{
    color:#888;
    text-align:center;
    margin-bottom:40px;
}

.searchBox{
    position:relative;
    width:min(850px,96vw);
}

.searchInput{
    width:100%;
    height:72px;

    border-radius:40px;

    border:
        1px solid rgba(255,255,255,.2);

    outline:none;

    background:
        rgba(255,255,255,.045);

    color:white;

    padding:
        0 155px 0 30px;

    font-size:17px;

    backdrop-filter:blur(20px);

    box-shadow:
        0 0 45px rgba(255,255,255,.04);
}

.searchInput::placeholder{
    color:#777;
}

.searchInput:focus{
    border-color:rgba(255,255,255,.55);
}

.searchButton{
    position:absolute;

    right:7px;
    top:7px;

    height:58px;

    border:0;

    border-radius:30px;

    padding:0 25px;

    background:#eee;

    color:#050505;

    font-weight:bold;

    cursor:pointer;
}

.voiceButton{
    position:absolute;

    right:105px;
    top:20px;

    border:0;
    background:none;

    color:white;

    font-size:23px;

    cursor:pointer;
}

/* categories */

.categories{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;

    gap:12px;

    max-width:900px;

    margin-top:32px;
}

.category{
    padding:11px 18px;

    border:
        1px solid rgba(255,255,255,.12);

    border-radius:30px;

    background:
        rgba(255,255,255,.03);

    color:#ddd;

    cursor:pointer;

    font-size:13px;

    transition:.3s;
}

.category:hover{
    background:
        rgba(255,255,255,.1);

    transform:translateY(-2px);
}

/* =========================
   RESULT
========================= */

#result{
    width:min(900px,94vw);

    margin:
        0 auto 70px;

    display:none;
}

.resultBox{
    padding:32px;

    border:
        1px solid rgba(255,255,255,.12);

    border-radius:25px;

    background:
        rgba(255,255,255,.035);

    backdrop-filter:blur(20px);
}

.resultTitle{
    font-size:22px;
    margin-bottom:20px;
    letter-spacing:2px;
}

.resultText{
    color:#d5d5d5;
    line-height:1.8;
    white-space:pre-wrap;
}

/* =========================
   EXIT
========================= */

.exit{
    position:fixed;

    left:20px;
    bottom:20px;

    z-index:200;

    padding:10px 18px;

    border:
        1px solid rgba(255,255,255,.15);

    border-radius:20px;

    background:
        rgba(255,255,255,.05);

    color:white;

    cursor:pointer;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .secretButton{
        width:160px;
        height:160px;
        font-size:19px;
        letter-spacing:4px;
    }

    .doorFrame{
        width:75vw;
        height:78vh;
    }

    .door::after{
        font-size:16px;
        letter-spacing:4px;
    }

    .searchInput{
        height:62px;
        padding-right:110px;
        padding-left:22px;
        font-size:14px;
    }

    .searchButton{
        height:48px;
        padding:0 18px;
    }

    .voiceButton{
        right:75px;
        top:17px;
    }

    .welcomeText{
        font-size:16px;
    }

}
</style>
</head>

<body>

<!-- =================================
     INTRO
================================= -->

<section id="intro">

    <div class="stars"></div>

    <div class="fog fog1"></div>
    <div class="fog fog2"></div>
    <div class="fog fog3"></div>

    <button
        class="secretButton"
        onclick="startMysterious()">

        MYSTERIOUS

        <span class="buttonSmall">
            ENTER THE UNKNOWN
        </span>

    </button>

</section>


<!-- =================================
     DOOR
================================= -->

<section id="doorScene">

    <div class="doorFog"></div>

    <div class="lightRay ray1"></div>
    <div class="lightRay ray2"></div>

    <div class="doorFrame">

        <div class="doorLight"></div>

        <div class="door">

            <div class="doorHandle"></div>

        </div>

    </div>

</section>


<!-- =================================
     WELCOME
================================= -->

<section id="welcome">

    <div class="welcomeBox">

        <div class="access">
            ACCESS GRANTED
        </div>

        <div class="welcomeTitle">
            MYSTERIOUS
        </div>

        <div
            id="typingText"
            class="welcomeText">
        </div>

        <button
            id="enterButton"
            class="enterButton"
            onclick="openRoom()"
            style="display:none">

            ENTER THE KNOWLEDGE ROOM

        </button>

    </div>

</section>


<!-- =================================
     KNOWLEDGE ROOM
================================= -->

<section id="room">

    <header class="header">

        <div class="logo">
            MYSTERIOUS
        </div>

        <div class="subtitle">
            SECRET KNOWLEDGE NETWORK
        </div>

    </header>


    <main class="searchArea">

        <h1 class="searchTitle">
            ENTER THE UNKNOWN
        </h1>

        <p class="searchDescription">
            Ask anything. Discover everything.
        </p>


        <div class="searchBox">

            <input
                id="searchInput"
                class="searchInput"
                type="text"
                placeholder="What do you want to know?"
                onkeydown="
                    if(event.key==='Enter'){
                        searchMysterious();
                    }
                "
            >

            <button
                class="voiceButton"
                onclick="voiceSearch()"
                title="Voice Search">

                🎤

            </button>

            <button
                class="searchButton"
                onclick="searchMysterious()">

                SEARCH

            </button>

        </div>


        <div class="categories">

            <div
                class="category"
                onclick="setSearch('भारत का इतिहास')">
                🇮🇳 History
            </div>

            <div
                class="category"
                onclick="setSearch('Science क्या है?')">
                🔬 Science
            </div>

            <div
                class="category"
                onclick="setSearch('Artificial Intelligence')">
                🤖 AI
            </div>

            <div
                class="category"
                onclick="setSearch('दुनिया के देशों की जानकारी')">
                🌍 World
            </div>

            <div
                class="category"
                onclick="setSearch('Technology')">
                💻 Technology
            </div>

            <div
                class="category"
                onclick="setSearch('General Knowledge')">
                🧠 Knowledge
            </div>

        </div>

    </main>


    <div id="result">

        <div class="resultBox">

            <div class="resultTitle">
                🔮 MYSTERIOUS RESULT
            </div>

            <div
                id="resultText"
                class="resultText">
            </div>

        </div>

    </div>


    <button
        class="exit"
        onclick="exitRoom()">

        ← Exit

    </button>

</section>


<script>

/* =================================
   SPEECH
================================= */

function speak(text){

    if(!window.speechSynthesis){
        return;
    }

    speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.lang="hi-IN";
    speech.rate=.86;
    speech.pitch=.82;
    speech.volume=1;

    speechSynthesis.speak(speech);
}


/* =================================
   START
================================= */

function startMysterious(){

    const intro =
        document.getElementById("intro");

    const door =
        document.getElementById("doorScene");

    intro.style.display="none";

    door.style.display="flex";

    setTimeout(function(){

        door.classList.add("open");

    },400);


    setTimeout(function(){

        door.style.display="none";

        showWelcome();

    },3700);
}


/* =================================
   WELCOME
================================= */

function showWelcome(){

    const welcome =
        document.getElementById("welcome");

    welcome.style.display="flex";

    const message =
        "Secret Room में आपका स्वागत है। आप एक ऐसी दुनिया में आ चुके हैं जहाँ आपको वह हर ज्ञान मिलेगा जो आप चाहते हैं। तो क्या आप तैयार हैं? Welcome to your Secret World.";

    typeText(
        message,
        function(){

            speak(message);

            document.getElementById(
                "enterButton"
            ).style.display="inline-block";

        }
    );
}


/* =================================
   TYPING
================================= */

function typeText(text,callback){

    const element =
        document.getElementById("typingText");

    element.innerHTML="";

    let index=0;

    const cursor =
        document.createElement("span");

    cursor.className="cursor";

    element.appendChild(cursor);


    function type(){

        if(index < text.length){

            cursor.insertAdjacentText(
                "beforebegin",
                text.charAt(index)
            );

            index++;

            setTimeout(type,32);

        }else{

            if(callback){
                callback();
            }

        }

    }

    type();
}


/* =================================
   ROOM
================================= */

function openRoom(){

    document.getElementById(
        "welcome"
    ).style.display="none";

    document.getElementById(
        "room"
    ).style.display="block";

    setTimeout(function(){

        document.getElementById(
            "searchInput"
        ).focus();

    },300);
}


/* =================================
   SEARCH
================================= */

function searchMysterious(){

    const input =
        document.getElementById("searchInput");

    const result =
        document.getElementById("result");

    const resultText =
        document.getElementById("resultText");

    const query =
        input.value.trim();

    if(!query){

        input.focus();

        return;

    }

    result.style.display="block";

    resultText.textContent =
        "आपका प्रश्न:\n\n" +
        "“" + query + "”\n\n" +

        "MYSTERIOUS ने आपका प्रश्न प्राप्त कर लिया है।\n\n" +

        "यह अभी front-end prototype है। " +

        "अगले चरण में इस search engine को सुरक्षित AI और Live Web Search से connect किया जाएगा, " +

        "ताकि वास्तविक और current information प्राप्त हो सके।";

    result.scrollIntoView({
        behavior:"smooth"
    });
}


/* =================================
   CATEGORY
================================= */

function setSearch(text){

    document.getElementById(
        "searchInput"
    ).value=text;

    searchMysterious();
}


/* =================================
   VOICE SEARCH
================================= */

function voiceSearch(){

    const Recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!Recognition){

        alert(
            "आपके browser में Voice Search उपलब्ध नहीं है।"
        );

        return;
    }

    const recognition =
        new Recognition();

    recognition.lang="hi-IN";

    recognition.interimResults=false;

    recognition.maxAlternatives=1;

    recognition.start();


    recognition.onresult=function(event){

        const text =
            event.results[0][0].transcript;

        document.getElementById(
            "searchInput"
        ).value=text;

        searchMysterious();
    };
}


/* =================================
   EXIT
================================= */

function exitRoom(){

    if(window.speechSynthesis){
        speechSynthesis.cancel();
    }

    document.getElementById(
        "room"
    ).style.display="none";

    document.getElementById(
        "result"
    ).style.display="none";

    document.getElementById(
        "searchInput"
    ).value="";

    document.getElementById(
        "intro"
    ).style.display="flex";
}

</script>

</body>
</html>
