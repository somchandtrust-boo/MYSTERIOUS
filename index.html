<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>MYSTERIOUS — Secret Knowledge Room</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#000;
    color:#fff;
}

button,input{
    font:inherit;
}

/* =========================
   INTRO
========================= */

#intro{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;

    background:
        radial-gradient(
            circle at center,
            #25282f 0%,
            #0a0b0e 35%,
            #000 75%
        );
}

.stars{
    position:absolute;
    inset:0;
    opacity:.4;

    background-image:
        radial-gradient(circle,#fff 1px,transparent 1px),
        radial-gradient(circle,rgba(255,255,255,.6) 1px,transparent 1px);

    background-size:100px 100px,160px 160px;

    animation:starsMove 20s linear infinite;
}

@keyframes starsMove{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(-100px);
    }
}

/* =========================
   FOG
========================= */

.fog{
    position:absolute;
    border-radius:50%;
    pointer-events:none;

    background:
        radial-gradient(
            ellipse,
            rgba(220,225,235,.25),
            rgba(120,125,135,.08),
            transparent 70%
        );

    filter:blur(50px);
}

.fog1{
    width:900px;
    height:430px;
    left:-300px;
    bottom:-120px;

    animation:
        fogMove1 10s
        infinite alternate
        ease-in-out;
}

.fog2{
    width:850px;
    height:400px;
    right:-280px;
    top:-100px;

    animation:
        fogMove2 12s
        infinite alternate
        ease-in-out;
}

.fog3{
    width:650px;
    height:300px;
    left:30%;
    top:40%;
    opacity:.25;

    animation:
        fogMove3 9s
        infinite alternate
        ease-in-out;
}

@keyframes fogMove1{
    from{
        transform:translateX(0) scale(1);
    }
    to{
        transform:translateX(300px) scale(1.3);
    }
}

@keyframes fogMove2{
    from{
        transform:translateX(0) scale(1);
    }
    to{
        transform:translateX(-250px) scale(1.25);
    }
}

@keyframes fogMove3{
    from{
        transform:translateX(-150px);
    }
    to{
        transform:translateX(180px);
    }
}

/* =========================
   MAIN BUTTON
========================= */

.secretButton{
    position:relative;
    z-index:20;

    width:220px;
    height:220px;

    border-radius:50%;

    border:
        1px solid rgba(255,255,255,.35);

    background:
        radial-gradient(
            circle at 32% 25%,
            #777b82,
            #292b30 35%,
            #050608 75%
        );

    color:#fff;

    cursor:pointer;

    font-size:25px;
    font-weight:bold;

    letter-spacing:5px;

    box-shadow:
        0 0 35px rgba(255,255,255,.12),
        inset 0 0 50px rgba(255,255,255,.08);

    transition:
        transform .4s,
        box-shadow .4s;
}

.secretButton:hover{
    transform:scale(1.08);

    box-shadow:
        0 0 80px rgba(255,255,255,.25),
        inset 0 0 55px rgba(255,255,255,.15);
}

.secretButton:active{
    transform:scale(.94);
}

.secretButton::before{
    content:"";

    position:absolute;

    inset:-18px;

    border-radius:50%;

    border:
        1px solid rgba(255,255,255,.18);

    animation:
        pulse 2.5s infinite;
}

.secretButton::after{
    content:"";

    position:absolute;

    inset:-40px;

    border-radius:50%;

    border:
        1px solid rgba(255,255,255,.06);
}

.buttonSmall{
    display:block;

    margin-top:10px;

    font-size:9px;

    letter-spacing:3px;

    opacity:.5;
}

@keyframes pulse{
    0%{
        transform:scale(.9);
        opacity:.8;
    }

    100%{
        transform:scale(1.3);
        opacity:0;
    }
}

/* =========================
   DOOR
========================= */

#doorScene{
    position:fixed;
    inset:0;

    display:none;

    justify-content:center;
    align-items:center;

    overflow:hidden;

    background:
        radial-gradient(
            ellipse at center,
            #393c43 0%,
            #15171b 40%,
            #020304 80%
        );

    z-index:50;
}

.doorFog{
    position:absolute;

    width:1100px;
    height:600px;

    border-radius:50%;

    background:
        radial-gradient(
            ellipse,
            rgba(230,235,240,.2),
            transparent 70%
        );

    filter:blur(55px);

    animation:
        doorFogMove 7s
        infinite alternate;
}

@keyframes doorFogMove{
    from{
        transform:translateX(-180px) scale(1);
    }

    to{
        transform:translateX(180px) scale(1.3);
    }
}

.lightRay{
    position:absolute;

    width:5px;
    height:90vh;

    background:
        rgba(255,255,255,.08);

    filter:blur(15px);

    opacity:0;
}

.ray1{
    left:35%;
    transform:rotate(18deg);
}

.ray2{
    left:55%;
    transform:rotate(-18deg);
}

#doorScene.open .lightRay{
    animation:
        rayOpen 2.5s forwards;
}

@keyframes rayOpen{
    0%{
        opacity:0;
    }

    100%{
        opacity:.8;
    }
}

.doorFrame{
    position:relative;

    width:min(420px,78vw);
    height:min(600px,84vh);

    border:9px solid #292b30;

    background:#000;

    box-shadow:
        0 0 40px rgba(255,255,255,.08),
        0 0 100px rgba(0,0,0,.9);

    overflow:hidden;
}

.doorLight{
    position:absolute;
    inset:0;

    background:
        radial-gradient(
            ellipse at center,
            rgba(255,255,255,.95),
            rgba(170,175,185,.35),
            transparent 70%
        );

    opacity:0;

    transition:2.5s;
}

#doorScene.open .doorLight{
    opacity:1;
}

.door{
    position:absolute;

    inset:0;

    background:
        linear-gradient(
            90deg,
            #070809,
            #292a2f 45%,
            #090a0c
        );

    border:3px solid #5c5d61;

    transform-origin:left center;

    transition:
        transform 3.2s
        cubic-bezier(.77,0,.18,1);

    z-index:5;

    box-shadow:
        inset 0 0 50px rgba(0,0,0,.8);
}

.door::before{
    content:"";

    position:absolute;

    inset:24px;

    border:
        1px solid rgba(255,255,255,.14);

    box-shadow:
        inset 0 0 20px rgba(255,255,255,.03);
}

.door::after{
    content:"MYSTERIOUS";

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    font-size:25px;

    letter-spacing:7px;

    color:
        rgba(255,255,255,.42);

    white-space:nowrap;
}

.doorHandle{
    position:absolute;

    right:30px;
    top:50%;

    width:17px;
    height:17px;

    border-radius:50%;

    background:#aaa;

    box-shadow:
        0 0 15px rgba(255,255,255,.6);

    animation:
        handleGlow 1.8s
        infinite alternate;
}

@keyframes handleGlow{
    from{
        box-shadow:
            0 0 7px
            rgba(255,255,255,.3);
    }

    to{
        box-shadow:
            0 0 25px
            rgba(255,255,255,.8);
    }
}

#doorScene.open .door{
    transform:
        perspective(1400px)
        rotateY(-108deg);
}

/* =========================
   WELCOME
========================= */

#welcome{
    position:fixed;
    inset:0;

    display:none;

    justify-content:center;
    align-items:center;

    text-align:center;

    padding:30px;

    background:
        radial-gradient(
            circle at center,
            #202229,
            #020304 70%
        );

    z-index:70;
}

.welcomeBox{
    width:min(850px,95vw);
}

.access{
    font-size:11px;

    letter-spacing:6px;

    color:#aaa;

    margin-bottom:25px;
}

.welcomeTitle{
    font-size:
        clamp(38px,8vw,80px);

    letter-spacing:9px;

    margin-bottom:28px;

    text-shadow:
        0 0 30px
        rgba(255,255,255,.15);
}

.welcomeText{
    min-height:170px;

    font-size:
        clamp(17px,2.6vw,25px);

    line-height:1.9;

    color:#ddd;
}

.cursor{
    display:inline-block;

    width:2px;
    height:20px;

    background:#fff;

    animation:
        blink .8s infinite;
}

@keyframes blink{
    50%{
        opacity:0;
    }
}

.enterButton{
    margin-top:30px;

    padding:16px 34px;

    border:
        1px solid
        rgba(255,255,255,.3);

    border-radius:50px;

    background:
        rgba(255,255,255,.05);

    color:#fff;

    cursor:pointer;

    letter-spacing:2px;

    transition:.3s;
}

.enterButton:hover{
    background:#fff;
    color:#000;
    transform:scale(1.04);
}

/* =========================
   KNOWLEDGE ROOM
========================= */

#room{
    position:fixed;
    inset:0;

    display:none;

    overflow-y:auto;

    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(120,125,140,.18),
            transparent 30%
        ),
        #030406;

    z-index:100;
}

.header{
    text-align:center;

    padding:28px 20px 10px;
}

.logo{
    font-size:30px;

    letter-spacing:9px;
}

.subtitle{
    margin-top:8px;

    font-size:10px;

    letter-spacing:4px;

    color:#888;
}

.searchArea{
    min-height:70vh;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    padding:30px 20px;
}

.searchTitle{
    text-align:center;

    font-size:
        clamp(32px,6vw,70px);

    letter-spacing:5px;

    margin-bottom:14px;
}

.searchDescription{
    color:#888;

    text-align:center;

    margin-bottom:40px;
}

.searchBox{
    position:relative;

    width:min(850px,96vw);
}

.searchInput{
    width:100%;

    height:72px;

    border-radius:40px;

    border:
        1px solid
        rgba(255,255,255,.2);

    outline:none;

    background:
        rgba(255,255,255,.045);

    color:white;

    padding:
        0 155px 0 30px;

    font-size:17px;

    backdrop-filter:blur(20px);

    box-shadow:
        0 0 45px
        rgba(255,255,255,.04);
}

.searchInput::placeholder{
    color:#777;
}

.searchInput:focus{
    border-color:
        rgba(255,255,255,.55);
}

.searchButton{
    position:absolute;

    right:7px;
    top:7px;

    height:58px;

    border:0;

    border-radius:30px;

    padding:0 25px;

    background:#eee;

    color:#050505;

    font-weight:bold;

    cursor:pointer;
}

.voiceButton{
    position:absolute;

    right:105px;
    top:20px;

    border:0;

    background:none;

    color:white;

    font-size:23px;

    cursor:pointer;
}

.categories{
    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:12px;

    max-width:900px;

    margin-top:32px;
}

.category{
    padding:11px 18px;

    border:
        1px solid
        rgba(255,255,255,.12);

    border-radius:30px;

    background:
        rgba(255,255,255,.03);

    color:#ddd;

    cursor:pointer;

    font-size:13px;

    transition:.3s;
}

.category:hover{
    background:
        rgba(255,255,255,.1);

    transform:
        translateY(-2px);
}

/* =========================
   RESULT
========================= */

#result{
    width:min(900px,94vw);

    margin:
        0 auto 70px;

    display:none;
}

.resultBox{
    padding:32px;

    border:
        1px solid
        rgba(255,255,255,.12);

    border-radius:25px;

    background:
        rgba(255,255,255,.035);

    backdrop-filter:blur(20px);
}

.resultTitle{
    font-size:22px;

    margin-bottom:20px;

    letter-spacing:2px;
}

.resultText{
    color:#d5d5d5;

    line-height:1.8;

    white-space:pre-wrap;
}

.loading{
    display:inline-block;

    width:18px;
    height:18px;

    border:
        2px solid
        rgba(255,255,255,.2);

    border-top-color:#fff;

    border-radius:50%;

    animation:
        spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.exit{
    position:fixed;

    left:20px;
    bottom:20px;

    z-index:200;

    padding:10px 18px;

    border:
        1px solid
        rgba(255,255,255,.15);

    border-radius:20px;

    background:
        rgba(255,255,255,.05);

    color:white;

    cursor:pointer;
}

@media(max-width:600px){

    .secretButton{
        width:165px;
        height:165px;

        font-size:19px;
        letter-spacing:4px;
    }

    .doorFrame{
        width:75vw;
        height:78vh;
    }

    .door::after{
        font-size:16px;
        letter-spacing:4px;
    }

    .searchInput{
        height:62px;

        padding-right:110px;
        padding-left:22px;

        font-size:14px;
    }

    .searchButton{
        height:48px;

        padding:0 18px;
    }

    .voiceButton{
        right:75px;
        top:17px;
    }

    .welcomeText{
        font-size:16px;
    }
}
</style>
</head>

<body>


<!-- =========================
     INTRO
========================= -->

<section id="intro">

    <div class="stars"></div>

    <div class="fog fog1"></div>
    <div class="fog fog2"></div>
    <div class="fog fog3"></div>

    <button
        id="mysteriousButton"
        class="secretButton">

        MYSTERIOUS

        <span class="buttonSmall">
            ENTER THE UNKNOWN
        </span>

    </button>

</section>


<!-- =========================
     SECRET DOOR
========================= -->

<section id="doorScene">

    <div class="doorFog"></div>

    <div class="lightRay ray1"></div>
    <div class="lightRay ray2"></div>

    <div class="doorFrame">

        <div class="doorLight"></div>

        <div class="door">

            <div class="doorHandle"></div>

        </div>

    </div>

</section>


<!-- =========================
     WELCOME
========================= -->

<section id="welcome">

    <div class="welcomeBox">

        <div class="access">
            ACCESS GRANTED
        </div>

        <div class="welcomeTitle">
            MYSTERIOUS
        </div>

        <div
            id="typingText"
            class="welcomeText">
        </div>

        <button
            id="enterButton"
            class="enterButton"
            style="display:none">

            ENTER THE KNOWLEDGE ROOM

        </button>

    </div>

</section>


<!-- =========================
     KNOWLEDGE ROOM
========================= -->

<section id="room">

    <header class="header">

        <div class="logo">
            MYSTERIOUS
        </div>

        <div class="subtitle">
            SECRET KNOWLEDGE NETWORK
        </div>

    </header>


    <main class="searchArea">

        <h1 class="searchTitle">
            ENTER THE UNKNOWN
        </h1>

        <p class="searchDescription">
            Ask anything. Discover everything.
        </p>


        <div class="searchBox">

            <input
                id="searchInput"
                class="searchInput"
                type="text"
                placeholder="What do you want to know?"
            >

            <button
                id="voiceButton"
                class="voiceButton"
                title="Voice Search">

                🎤

            </button>

            <button
                id="searchButton"
                class="searchButton">

                SEARCH

            </button>

        </div>


        <div class="categories">

            <button
                class="category"
                data-query="भारत का इतिहास">

                🇮🇳 History

            </button>

            <button
                class="category"
                data-query="Science क्या है?">

                🔬 Science

            </button>

            <button
                class="category"
                data-query="Artificial Intelligence">

                🤖 AI

            </button>

            <button
                class="category"
                data-query="दुनिया के देशों की जानकारी">

                🌍 World

            </button>

            <button
                class="category"
                data-query="Technology">

                💻 Technology

            </button>

            <button
                class="category"
                data-query="General Knowledge">

                🧠 Knowledge

            </button>

        </div>

    </main>


    <div id="result">

        <div class="resultBox">

            <div class="resultTitle">
                🔮 MYSTERIOUS RESULT
            </div>

            <div
                id="resultText"
                class="resultText">
            </div>

        </div>

    </div>


    <button
        id="exitButton"
        class="exit">

        ← Exit

    </button>

</section>


<script>

/* ==================================================
   MYSTERIOUS CONFIGURATION
================================================== */

const BACKEND_URL =
    "https://mysterious-backend.onrender.com";


/* ==================================================
   DOM
================================================== */

const intro =
    document.getElementById("intro");

const doorScene =
    document.getElementById("doorScene");

const welcome =
    document.getElementById("welcome");

const room =
    document.getElementById("room");

const mysteriousButton =
    document.getElementById("mysteriousButton");

const enterButton =
    document.getElementById("enterButton");

const searchButton =
    document.getElementById("searchButton");

const voiceButton =
    document.getElementById("voiceButton");

const searchInput =
    document.getElementById("searchInput");

const exitButton =
    document.getElementById("exitButton");

const result =
    document.getElementById("result");

const resultText =
    document.getElementById("resultText");


/* ==================================================
   VOICE
================================================== */

function speak(text){

    if(
        !("speechSynthesis" in window)
    ){
        return;
    }

    window.speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.lang = "hi-IN";
    speech.rate = .85;
    speech.pitch = .8;
    speech.volume = 1;

    window.speechSynthesis.speak(
        speech
    );
}


/* ==================================================
   START MYSTERIOUS
================================================== */

function startMysterious(){

    intro.style.display = "none";

    doorScene.style.display = "flex";

    setTimeout(() => {

        doorScene.classList.add("open");

    },400);


    setTimeout(() => {

        doorScene.style.display = "none";

        showWelcome();

    },3700);

}


/* ==================================================
   WELCOME
================================================== */

function showWelcome(){

    welcome.style.display = "flex";

    const message =
        "Secret Room में आपका स्वागत है। " +
        "आप एक ऐसी दुनिया में आ चुके हैं " +
        "जहाँ आपको वह हर ज्ञान मिलेगा जो आप चाहते हैं। " +
        "तो क्या आप तैयार हैं? " +
        "Welcome to your Mysterious World.";

    typeText(
        message,
        () => {

            speak(message);

            enterButton.style.display =
                "inline-block";

        }
    );

}


/* ==================================================
   TYPE EFFECT
================================================== */

function typeText(
    text,
    callback
){

    const element =
        document.getElementById(
            "typingText"
        );

    element.innerHTML = "";

    let index = 0;

    const cursor =
        document.createElement(
            "span"
        );

    cursor.className =
        "cursor";

    element.appendChild(cursor);


    function type(){

        if(index < text.length){

            cursor.insertAdjacentText(
                "beforebegin",
                text.charAt(index)
            );

            index++;

            setTimeout(
                type,
                32
            );

        }else{

            if(callback){
                callback();
            }

        }

    }

    type();

}


/* ==================================================
   OPEN ROOM
================================================== */

function openRoom(){

    welcome.style.display =
        "none";

    room.style.display =
        "block";

    setTimeout(() => {

        searchInput.focus();

    },300);

}


/* ==================================================
   SEARCH BACKEND
================================================== */

async function searchMysterious(){

    const query =
        searchInput.value.trim();


    if(!query){

        searchInput.focus();

        return;

    }


    result.style.display =
        "block";


    resultText.innerHTML = `
        <div style="
            display:flex;
            align-items:center;
            gap:10px;
            color:#aaa;
        ">
            <span class="loading"></span>
            Mysterious is thinking...
        </div>
    `;


    result.scrollIntoView({
        behavior:"smooth"
    });


    try{

        const response =
            await fetch(
                BACKEND_URL + "/ask",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        question:query
                    })
                }
            );


        if(!response.ok){

            throw new Error(
                "Server Error: " +
                response.status
            );

        }


        const data =
            await response.json();


        if(data.success){

            resultText.textContent =
                data.answer ||
                "No answer received.";

        }else{

            resultText.textContent =
                data.error ||
                "Mysterious could not answer.";

        }


    }catch(error){

        console.error(
            "Mysterious Error:",
            error
        );


        resultText.textContent =
            "⚠️ Mysterious server से connection नहीं हो पाया।\n\n" +
            "Backend अभी starting हो सकता है। " +
            "कुछ seconds बाद फिर कोशिश करें।";

    }

}


/* ==================================================
   VOICE SEARCH
================================================== */

function voiceSearch(){

    const Recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(!Recognition){

        alert(
            "आपके browser में Voice Search उपलब्ध नहीं है।"
        );

        return;

    }


    const recognition =
        new Recognition();


    recognition.lang =
        "hi-IN";


    recognition.interimResults =
        false;


    recognition.maxAlternatives =
        1;


    recognition.start();


    recognition.onstart =
        () => {

            voiceButton.textContent =
                "🔴";

        };


    recognition.onend =
        () => {

            voiceButton.textContent =
                "🎤";

        };


    recognition.onerror =
        () => {

            voiceButton.textContent =
                "🎤";

        };


    recognition.onresult =
        (event) => {

            const text =
                event
                .results[0][0]
                .transcript;


            searchInput.value =
                text;


            searchMysterious();

        };

}


/* ==================================================
   EXIT
================================================== */

function exitRoom(){

    if(
        "speechSynthesis"
        in window
    ){

        speechSynthesis.cancel();

    }


    room.style.display =
        "none";


    result.style.display =
        "none";


    searchInput.value =
        "";


    welcome.style.display =
        "none";


    doorScene.style.display =
        "none";


    doorScene.classList.remove(
        "open"
    );


    intro.style.display =
        "flex";

}


/* ==================================================
   EVENTS
================================================== */

mysteriousButton.addEventListener(
    "click",
    startMysterious
);


enterButton.addEventListener(
    "click",
    openRoom
);


searchButton.addEventListener(
    "click",
    searchMysterious
);


voiceButton.addEventListener(
    "click",
    voiceSearch
);


exitButton.addEventListener(
    "click",
    exitRoom
);


searchInput.addEventListener(
    "keydown",
    (event) => {

        if(
            event.key === "Enter"
        ){

            searchMysterious();

        }

    }
);


document
    .querySelectorAll(".category")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                searchInput.value =
                    button.dataset.query;

                searchMysterious();

            }
        );

    });


/* ==================================================
   INITIAL STATE
================================================== */

intro.style.display =
    "flex";

doorScene.style.display =
    "none";

welcome.style.display =
    "none";

room.style.display =
    "none";

</script>

</body>
</html>
